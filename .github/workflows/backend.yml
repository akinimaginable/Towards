name: Backend

on:
  push:
    branches: [main]
    paths:
      - server/**
      - core/**
      - gradle/**
      - gradlew
      - gradle.properties
      - gradle.properties.docker
      - settings.gradle.kts
      - settings.docker.gradle.kts
      - build.gradle.kts
      - build.gradle.docker.kts
      - Dockerfile
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - server/**
      - core/**
      - gradle/**
      - gradlew
      - gradle.properties
      - gradle.properties.docker
      - settings.gradle.kts
      - settings.docker.gradle.kts
      - build.gradle.kts
      - build.gradle.docker.kts
      - Dockerfile
      - .github/workflows/backend.yml

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Use server-only Gradle build
        run: |
          cp gradle.properties.docker gradle.properties
          cp settings.docker.gradle.kts settings.gradle.kts
          cp build.gradle.docker.kts build.gradle.kts
          cp core/build.gradle.docker.kts core/build.gradle.kts
          rm -f gradle/gradle-daemon-jvm.properties

      - name: Test and assemble
        run: ./gradlew :core:jvmTest :server:test :server:shadowJar --no-daemon

  publish-image:
    name: Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Docker image with Buildx (don't push on PR)
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          image="$(printf '%s\n' "$TAGS" | sed '/^$/d' | head -n 1)"
          if [ -z "$image" ] || [ -z "$DIGEST" ]; then
            echo "Missing image tag or digest" >&2
            exit 1
          fi
          cosign sign --yes "${image}@${DIGEST}"
