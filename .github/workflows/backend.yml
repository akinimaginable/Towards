name: Backend

on:
  push:
    branches: [main]
    paths:
      - server/**
      - core/**
      - gradle/**
      - gradlew
      - gradle.properties
      - gradle.properties.docker
      - settings.gradle.kts
      - settings.docker.gradle.kts
      - build.gradle.kts
      - build.gradle.docker.kts
      - Dockerfile
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - server/**
      - core/**
      - gradle/**
      - gradlew
      - gradle.properties
      - gradle.properties.docker
      - settings.gradle.kts
      - settings.docker.gradle.kts
      - build.gradle.kts
      - build.gradle.docker.kts
      - Dockerfile
      - .github/workflows/backend.yml

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Use server-only Gradle build
        run: |
          cp gradle.properties.docker gradle.properties
          cp settings.docker.gradle.kts settings.gradle.kts
          cp build.gradle.docker.kts build.gradle.kts
          cp core/build.gradle.docker.kts core/build.gradle.kts
          rm -f gradle/gradle-daemon-jvm.properties

      - name: Test and assemble
        run: ./gradlew :core:jvmTest :server:test :server:shadowJar --no-daemon

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t towards-backend:ci .
