ktor {
    application {
        modules = [ org.etrange.towards.ApplicationKt.module ]
    }
    deployment {
        host = "0.0.0.0"
        port = 8081
        port = ${?PORT}
    }
}

towards {
    motis {
        baseUrl = "https://api.transitous.org"
        baseUrl = ${?MOTIS_BASE_URL}
        requestTimeoutMillis = 15000
        requestTimeoutMillis = ${?MOTIS_REQUEST_TIMEOUT_MS}
    }
    database {
        enabled = true
        enabled = ${?DATABASE_ENABLED}
        url = "jdbc:postgresql://localhost:5432/towards"
        url = ${?DATABASE_URL}
        user = "ema"
        user = ${?DATABASE_USER}
        password = ""
        password = ${?DATABASE_PASSWORD}
        pool {
            maximumPoolSize = 10
            maximumPoolSize = ${?DATABASE_POOL_SIZE}
            minimumIdle = 2
            minimumIdle = ${?DATABASE_POOL_MIN_IDLE}
            connectionTimeoutMillis = 30000
            connectionTimeoutMillis = ${?DATABASE_POOL_CONNECTION_TIMEOUT_MS}
            idleTimeoutMillis = 600000
            idleTimeoutMillis = ${?DATABASE_POOL_IDLE_TIMEOUT_MS}
            maxLifetimeMillis = 1800000
            maxLifetimeMillis = ${?DATABASE_POOL_MAX_LIFETIME_MS}
        }
    }
    rateLimit {
        requests = 120
        requests = ${?RATE_LIMIT_REQUESTS}
        periodSeconds = 60
        periodSeconds = ${?RATE_LIMIT_PERIOD_SECONDS}
    }
    authentication {
        dummyUserId = "00000000-0000-0000-0000-000000000001"
        dummyUserId = ${?DUMMY_USER_ID}
    }
}
